name: Publish to PowerShell Gallery

on:
  push:
    branches:
      - main

jobs:
  PublishToGallery:
    runs-on: windows-latest

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/mgx'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          ./build.ps1
          Test-ModuleManifest -Path ./Modules/M365DSC.mgx/M365DSC.mgx.psd1

      # The gallery package name comes from the manifest file name, so this
      # publishes as M365DSC.mgx.
      - name: Publish
        shell: pwsh
        env:
          PUBLIC_NUGETAPIKEY: ${{ secrets.NUGETAPIKEY }}
        run: |
          Publish-Module -Path "./Modules/M365DSC.mgx" -NugetAPIKey $env:PUBLIC_NUGETAPIKEY
