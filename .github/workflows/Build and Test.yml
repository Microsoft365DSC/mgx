name: Build and Test

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/mgx'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Mgx.slnx

      # Compiles Mgx.Engine, Mgx.Cmdlets and the test project, then stages the
      # module (including the ALC-isolated dependencies) into Modules/M365DSC.mgx.
      # The Pester tests below run against this build output.
      - name: Build Module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      # Engine and cmdlet internals: HTTP retry and throttling, nextLink SSRF
      # validation, resume state, and JSON-to-Hashtable conversion.
      - name: Run xUnit Tests
        run: >
          dotnet test Tests/Mgx.IntegrationTests/Mgx.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=Mgx.IntegrationTests.trx"
          --results-directory TestResults

      - name: Install Modules
        shell: pwsh
        run: |
          Install-PSResource -Name Pester -Scope AllUsers -TrustRepository
          # Declared in RequiredModules; importing M365DSC.mgx fails without it
          Install-PSResource -Name Microsoft.Graph.Authentication -Scope AllUsers -TrustRepository

      # Module surface: manifest, packaging, format file, cmdlet and parameter contract.
      - name: Run Pester Tests
        shell: pwsh
        run: |
          Import-Module './Tests/TestHarness.psm1' -Force

          $results = Invoke-TestHarness -IgnoreCodeCoverage

          if ($results.FailedCount -gt 0)
          {
              throw "$($results.FailedCount) Pester test(s) failed"
          }

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./Modules/M365DSC.mgx/M365DSC.mgx.psd1

      - name: Validate Module Import
        shell: pwsh
        run: |
          Import-Module ./Modules/M365DSC.mgx/M365DSC.mgx.psd1 -Force -ErrorAction Stop
          # M365DSC.mgx is a binary module: it exports cmdlets, FunctionsToExport is empty
          $exportedCmdlets = (Get-Module M365DSC.mgx).ExportedCmdlets.Keys
          if ($exportedCmdlets.Count -eq 0)
          {
              throw "No cmdlets exported from the M365DSC.mgx module."
          }
          Write-Host "Exported cmdlets: $($exportedCmdlets -join ', ')"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/*.trx
            Tests/TestResults.xml
          if-no-files-found: warn
