name: Build and Test

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  windows:
    name: Build, Unit Tests and Module Surface
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/mgx'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Mgx.slnx

      # Stages the module into Modules/M365DSC.mgx, which the Pester tests below run against.
      - name: Build Module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Run xUnit Tests
        run: >
          dotnet test Tests/Mgx.IntegrationTests/Mgx.IntegrationTests.csproj
          --configuration Release
          --no-build
          --settings Tests/coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=Mgx.IntegrationTests.trx"
          --results-directory TestResults/windows

      - name: Install Modules
        shell: pwsh
        run: |
          Install-PSResource -Name Pester -Scope AllUsers -TrustRepository
          # Declared in RequiredModules, so importing M365DSC.mgx fails without it
          Install-PSResource -Name Microsoft.Graph.Authentication -Scope AllUsers -TrustRepository

      - name: Run Pester Tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path TestResults/windows | Out-Null
          Import-Module './Tests/TestHarness.psm1' -Force

          $results = Invoke-TestHarness -IgnoreCodeCoverage

          # Handed to the report job directly, since the run object is the authoritative count
          [pscustomobject]@{
              Suite   = 'Pester - module surface'
              Passed  = $results.PassedCount
              Failed  = $results.FailedCount
              Skipped = $results.SkippedCount
          } | ConvertTo-Json | Set-Content -Path TestResults/windows/pester-summary.json -Encoding utf8

          if ($results.FailedCount -gt 0)
          {
              throw "$($results.FailedCount) Pester test(s) failed"
          }

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./Modules/M365DSC.mgx/M365DSC.mgx.psd1

      - name: Validate Module Import
        shell: pwsh
        run: |
          Import-Module ./Modules/M365DSC.mgx/M365DSC.mgx.psd1 -Force -ErrorAction Stop
          # M365DSC.mgx is a binary module, so it exports cmdlets and FunctionsToExport is empty
          $exportedCmdlets = (Get-Module M365DSC.mgx).ExportedCmdlets.Keys
          if ($exportedCmdlets.Count -eq 0)
          {
              throw "No cmdlets exported from the M365DSC.mgx module."
          }
          Write-Host "Exported cmdlets: $($exportedCmdlets -join ', ')"

      - name: Upload Windows Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-windows
          path: |
            TestResults/windows/**
            Tests/TestResults.xml
          if-no-files-found: warn

  e2e:
    name: Cmdlet E2E against a WireMock container
    runs-on: ubuntu-latest

    # Linux only, because windows-latest runners cannot host the Linux WireMock image
    if: github.repository == 'Microsoft365DSC/mgx'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Pulled explicitly so a registry problem fails here rather than as a wait-strategy timeout
      - name: Pre-pull WireMock Image
        run: docker pull wiremock/wiremock:3.13.1

      - name: Run E2E Tests
        run: >
          dotnet test Tests/Mgx.E2ETests/Mgx.E2ETests.csproj
          --configuration Release
          --settings Tests/coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=Mgx.E2ETests.trx"
          --results-directory TestResults/linux

      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-linux
          path: TestResults/linux/**
          if-no-files-found: warn

  report:
    name: Test and Coverage Summary
    runs-on: ubuntu-latest
    needs: [windows, e2e]

    # Runs even when a test job failed, which is when the report matters most
    if: always() && github.repository == 'Microsoft365DSC/mgx'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: artifacts

      # Merges the per-job Cobertura files into one number rather than two partial ones
      - name: Build Coverage Report
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            -reports:"artifacts/**/coverage.cobertura.xml" \
            -targetdir:coverage/report \
            -reporttypes:"MarkdownSummaryGithub;Html;Cobertura"

      - name: Write Run Summary
        shell: pwsh
        run: ./.github/scripts/Write-TestSummary.ps1 -ArtifactRoot artifacts

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: coverage/report
          if-no-files-found: warn
